# LOGGING
log_level: "DEBUG" # "INFO"
log_to_file: true
log_file: "agent_rag.log"

debugger: false

# use internet connection
online: True


# Directory containing PDFs
md_dir: "./Markdown_IT"

# Dizionario path
dizionario_path: "./dizionario.xlsx"

# FAISS index persistence
index_dir: "./faiss_index"

# Reindex PDFs or not
reindex: false
workers: 8

# Move index to GPU if available
use_gpu_index: false

# Model quantization
quantization: false

# Embeddings, LLM, reranker
# embed_model: "intfloat/multilingual-e5-base"
# embed_model: "BAAI/bge-small-en-v1.5"  # on Mac
embed_model: "BAAI/bge-m3"   #  8192 tokens.
# llm_model: "mistralai/Mistral-Small-Instruct-2409"
llm_model: "mistralai/Mistral-Small-24B-Instruct-2501" # "unsloth/Mistral-Small-24B-Instruct-2501-bnb-4bit"
rerank_model: "BAAI/bge-reranker-v2-m3"


# Not so good for editing and cleaning answers:
# llm_model: "mistralai/Mistral-7B-Instruct-v0.2"   # "mlx-community/Mistral-7B-Instruct-v0.2-4bit"

# llm_model: "meta-llama/Llama-3.2-1B-Instruct"  # on Mac
# llm_model: "meta-llama/Llama-3.2-3B-Instruct"  # on Mac
# rerank_model: "cross-encoder/mmarco-mMiniLMv2-L12-H384-v1"


# ALTERNATIVES FOR MAC
# embed_model: "BAAI/bge-small-en-v1.5"
# embed_model: "sentence-transformers/all-MiniLM-L6-v2"
# llm_model: "openbmb/MiniCPM-2B-dpo-bf16-llama-format"
# rerank_model: "BAAI/bge-reranker-base"


# Retrieval
rerank: true
k: 32
k_reranked: 6
search_type: "similarity"  # "similarity" | "mmr"
fetch_k: 120  # only used for MMR
lambda_mult: 0.3  # 0=more diverse, 1=less diverse

threshold: 0.1  # reranker threshold
# to get probability use: torch.sigmoid(torch.tensor([-3, -2, -1, 0, 1, 2, 3]))


clean_answer: true

# Chunking
chunk_size: 1200           # number of characters
chunk_overlap: 300
min_chunk_length: 100


# top_k  keeps only the k most probable tokens and sets the rest to zero.
# top_p  keeps the smallest set of tokens whose cumulative probability reaches p.
# repetition_penalty penalizes tokens that have already appeared in the generated text.
# no_repeat_ngram_size ensures that no n-grams of the specified size are repeated in the generated text.

# LLM generation
max_new_tokens: 1024
temperature: 0.1
top_p: 0.95
top_k: 40
repetition_penalty: 1.0          # 1.1–1.3 typically. 1.0 means no penalty
no_repeat_ngram_size: 0          # avoid short repeated phrases

# Huggingface cache directory
hf_home: "/fast_disk/models/huggingface"  # "/home/models/HF-Cache"
# hf_home: "/Users/nicola/.cache/huggingface" # Mac

# hf_token is loaded from the HF_TOKEN environment variable (see .env)
# Do NOT set hf_token here


# Interactive options
chat: false

gradio: true
gradio_host: "0.0.0.0"
gradio_port: 7860
gradio_share: true


max_history_turns: 6  # Number of Q&A pairs to remember



# BAAI/bge-small-en-v1.5    384-dimensional vectors
# BAAI/bge-base-en-v1.5     768-dimensional vectors.
# BAAI/bge-large-en-v1.5    1024-dimensional vectors.
# nomic-ai/nomic-embed-text-v1.5
# BAAI/bge-multilingual-gemma2. # too heavy 50 GB


# Embedder: nomic-ai/nomic-embed-text-v1.5
# → This is English-optimized, not really multilingual. It will embed Italian, but the alignment between Italian queries and English documents will be weak.

# LLM: mistralai/Mistral-7B-Instruct-v0.2
# → Can handle both Italian and English fluently, so generation is not the issue.

# Reranker: cross-encoder/ms-marco-MiniLM-L-6-v2
# → Also English-only. It won’t rerank Italian queries properly against English documents.
