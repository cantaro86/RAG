# .github/workflows/pre-commit.yml
name: pre-commit

on:
  pull_request:
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.14"
      - run: uvx pre-commit run --all-files
