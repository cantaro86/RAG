name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# A newer push cancels the review still running for the same PR
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Skip drafts: push freely to a draft PR, then mark it ready to get one review
    if: github.event.pull_request.draft == false
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # setuptools-scm needs tags; also enables git log/blame

      # Same environment as test.yml so the reviewer can confirm suspected bugs
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install package with dev dependencies
        run: uv sync --locked --extra dev

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Token budget: Sonnet at medium effort, and force the plugin's subagents
          # (which otherwise run its bug-hunting agents on Opus) onto Sonnet as well.
          settings: |
            {
              "env": {
                "CLAUDE_CODE_EFFORT_LEVEL": "medium",
                "CLAUDE_CODE_SUBAGENT_MODEL": "sonnet",
                "CLAUDE_CODE_SUBAGENT_MODEL_FORCE": "1"
              }
            }
          # Lines starting with '#' inside claude_args are stripped by the action.
          claude_args: |
            --model sonnet
            --allowedTools
            # Post inline review comments
            "mcp__github_inline_comment__create_inline_comment"
            # PR context used by the code-review plugin, granted session-wide so its subagents can use it too
            "Bash(gh pr view:*)"
            "Bash(gh pr diff:*)"
            "Bash(gh pr list:*)"
            "Bash(gh pr comment:*)"
            "Bash(gh issue view:*)"
            "Bash(gh issue list:*)"
            "Bash(gh search:*)"
            # Read-only git history
            "Bash(git diff:*)"
            "Bash(git log:*)"
            "Bash(git show:*)"
            "Bash(git blame:*)"
            # Verify findings without rewriting files
            "Bash(uv run pytest:*)"
            "Bash(uv run ruff check:*)"
            "Bash(uv run ruff format --check:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
